version: '3.8'

networks:
  taxi-net:
    driver: bridge

services:
  # ============================================================================
  # Apache Kafka (KRaft mode - No ZooKeeper required, saves ~350 MB RAM)
  # ============================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: taxi-kafka
    networks:
      - taxi-net
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms128m -Xmx512m"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ============================================================================
  # Single-Node Apache Hadoop (HDFS + YARN MapReduce Streaming)
  # ============================================================================
  hadoop:
    build:
      context: ./hadoop
      dockerfile: Dockerfile
    container_name: hadoop-single-node
    hostname: hadoop-single-node
    networks:
      - taxi-net
    ports:
      - "9870:9870" # HDFS NameNode Web UI
      - "9000:9000" # HDFS NameNode IPC
      - "8088:8088" # YARN ResourceManager Web UI
    deploy:
      resources:
        limits:
          memory: 1792M
    healthcheck:
      test: ["CMD-SHELL", "/opt/hadoop/bin/hdfs dfsadmin -report || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 30s
